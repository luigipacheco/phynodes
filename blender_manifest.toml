# phynodes — Connect Blender to physical inputs and outputs through MQTT
# Part of the Animaquina robot IDE family of add-ons.
# Schema: https://developer.blender.org/docs/features/extensions/schema/1.0.0

schema_version = "1.0.0"
id = "phynodes"
version = "0.1.0"
name = "PhyNodes"
tagline = "Connect Blender to physical inputs and outputs through MQTT"
type = "add-on"
maintainer = "Luis Arturo Pacheco"
license = ["SPDX:GPL-3.0-or-later"]
blender_version_min = "4.2.0"

website = "https://www.animaquina.com"

# Bundled Python dependencies. paho-mqtt is pure-Python (py3-none-any), so the
# one universal wheel covers every platform. Blender installs it on enable, so
# users don't need pip. Refresh with:
#   python -m pip download paho-mqtt --only-binary=:all: --no-deps -d wheels
wheels = [
    "./wheels/paho_mqtt-2.1.0-py3-none-any.whl",
]
