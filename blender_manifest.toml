# phynodes — Connect Blender to physical inputs and outputs through MQTT
# Part of the Animaquina robot IDE family of add-ons.
# Schema: https://developer.blender.org/docs/features/extensions/schema/1.0.0

schema_version = "1.0.0"
id = "phynodes"
version = "0.4.0"
name = "PhyNodes"
tagline = "Connect Blender to physical inputs and outputs through MQTT and OSC"
type = "add-on"
maintainer = "Luis Arturo Pacheco"
license = ["SPDX:GPL-3.0-or-later"]
blender_version_min = "4.2.0"

website = "https://www.animaquina.com"

# Bundled Python dependencies. paho-mqtt and python-osc are pure-Python
# (py3-none-any), so one universal wheel each covers every platform. Blender
# installs them on enable, so users don't need pip. Refresh with:
#   python -m pip download <name> --only-binary=:all: --no-deps -d wheels
wheels = [
    "./wheels/paho_mqtt-2.1.0-py3-none-any.whl",
    "./wheels/python_osc-1.10.2-py3-none-any.whl",
]

# Keep dev-only files out of the extension zip when building with
# `blender --command extension build` (build.ps1 excludes the same set).
[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".*",
    "tests/",
    "*.zip",
]
